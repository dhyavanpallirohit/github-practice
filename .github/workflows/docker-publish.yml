name: Docker Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/github-practice-risk-api:${{ steps.version.outputs.VERSION }} \
            -t ghcr.io/${{ github.repository_owner }}/github-practice-risk-api:latest \
            .

      - name: Push versioned image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/github-practice-risk-api:${{ steps.version.outputs.VERSION }}

      - name: Push latest image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/github-practice-risk-api:latest