name: Python CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Show environment
        run: |
          echo "Environment: $APP_ENV"
        env:
          APP_ENV: ${{ vars.APP_ENV }}

      - name: Verify secret exists
        run: |
          if [ -z "$DEMO_API_KEY" ]; then
            echo "Secret is missing"
            exit 1
          fi

          echo "Secret is configured"
        env:
          DEMO_API_KEY: ${{ secrets.DEMO_API_KEY }}

      - name: Run tests
        run: |
          pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t github-practice-risk:ci .

      - name: Run Docker container
        run: |
          docker run --rm github-practice-risk:ci