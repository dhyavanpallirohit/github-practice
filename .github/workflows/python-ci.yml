name: Python CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t github-practice-risk-api:ci .

      - name: Start Docker container
        run: |
          docker run -d \
            --name risk-api \
            -p 8000:8000 \
            github-practice-risk-api:ci

      - name: Wait for API
        run: |
          sleep 5

      - name: Test API
        run: |
          curl --fail http://localhost:8000/
          curl --fail "http://localhost:8000/predict?score=85"

      - name: Show container logs
        if: always()
        run: |
          docker logs risk-api || true

      - name: Stop Docker container
        if: always()
        run: |
          docker stop risk-api || true